<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certifications | Chris Goss</title>
    <link rel="icon" href="../images/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="../images/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../rainglow.css" />
    <link rel="stylesheet" href="../card.css" />
    <script src="https://kit.fontawesome.com/49beee2559.js" crossorigin="anonymous"></script>
  </head>

  <body data-root="..">
    <div id="Header"></div>

    <main class="learning" tabindex="-1">
      <h1 aria-label="Certifications"><span class="title-full" aria-hidden="true">Certifications</span><span class="title-short" aria-hidden="true">Certs</span></h1>
      
      <div class="cards">
        <article class="card card-text-icons">
          <p class="card-title">cert.earned</p>
          <div class="card-content">

            <div class="card-group">
              <p><a href="../images/cert_software.png" data-preview="images/cert_software.png" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-file-contract" aria-hidden="true"></i> Software Dev Fundamentals</a></p>
            </div>

            <div class="card-group">
              <p><a href="../images/cert_frontend.png" data-preview="images/cert_frontend.png" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-file-contract" aria-hidden="true"></i> Front End Web Dev</a></p>
            </div>

          </div>
        </article>

        <article class="card card-span-two">
          <p class="card-title">cert.queue</p>
          <div class="card-content" id="CertificateQueue">
            <p>Loading certificate activity...</p>
          </div>
        </article>

      </div>
    </main>

    <div id="Footer"></div>
    <script src="../script.js"></script>
    <script src="../learning/activity.js"></script>
    <script src="../stars.js"></script>
    <script src="../rainburst.js"></script>
  </body>
</html>
